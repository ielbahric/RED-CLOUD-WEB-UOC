
apiVersion: apps/v1
kind: Deployment
metadata:
  name: red-cloud-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: red-cloud-web
  template:
    metadata:
      labels:
        app: red-cloud-web
    spec:
      containers:
        - name: red-cloud-web
          image: red-cloud-web:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
